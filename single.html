<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex, nofollow" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=Oswald:wght@500;600&display=swap" rel="stylesheet" />

<title>通常購入</title>
</head>
<body class="ds-preview">
<section class="section" id="single">
  <div class="container">
    <div class="section__head reveal">
      <span class="bar"></span>
      <h2>まずは味を試したい方へ <span class="en">Single Purchase</span></h2>
    </div>
    <div class="single reveal">
      <div>
        <p class="lead">餃子40個入り</p>
        <div class="single__price">
          <b>¥<span data-bind="price.single">3,980</span></b>
          <small>税込・送料込み<i class="kari">仮</i></small>
        </div>
        <p class="single__note">1食10個×4回分。冷凍庫にストックして、食べたいときに4分で。</p>
        <div class="single__cta">
          <a href="#" class="btn btn--outline">単品で購入する</a>
        </div>
      </div>
      <div class="ph">商品パッケージ写真<br />(撮影素材差し替え)</div>
    </div>
  </div>
</section>

<script src="main.js?v=53db0c2d"></script>
</body>
