      <h2>RIZIN餃子とは <span class="en">Concept</span></h2>

    <p class="concept-statement reveal">選手は、食べて戦う。<br />ファンは、<span class="accent">食べて応援する。</span></p>

      </div>
      <div class="pillar-card">
        <p class="pillar-card__en en">Eat</p>
        <h3>餃子として、普通にうまい</h3>

      </div>
      <div class="pillar-card">
        <p class="pillar-card__en en">Repeat</p>
        <h3>続けることが、応援になる</h3>
        <p>冷凍常備で無理なく続く。続いた応援は、推し選手への還元につながる。</p>
